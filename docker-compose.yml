version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumni_web
    restart: always
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=alumni_db
      - DB_USER=alumni_user
      - DB_PASS=alumni_secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/var/www/html

  db:
    image: mysql:8.0
    container_name: alumni_db
    restart: always
    environment:
      - MYSQL_DATABASE=alumni_db
      - MYSQL_USER=alumni_user
      - MYSQL_PASSWORD=alumni_secret
      - MYSQL_ROOT_PASSWORD=root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "alumni_user", "-palumni_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
