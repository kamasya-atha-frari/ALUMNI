services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumni_istu_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      - DOCKER_ENV=true
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-alumni_istu}
      - DB_USER=${DB_USER:-alumni_admin}
      - DB_PASS=${DB_PASS:-alumni_secure_2026}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:-alumni-istu-hs256-dev-secret-change-in-production-2026}
      - AUTH_TOKEN_TTL_SECONDS=${AUTH_TOKEN_TTL_SECONDS:-3600}
      - CAPTCHA_DRIVER=${CAPTCHA_DRIVER:-local_svg}
      - CAPTCHA_MODE=${CAPTCHA_MODE:-alphanumeric}
      - CAPTCHA_TTL_SECONDS=${CAPTCHA_TTL_SECONDS:-300}
      - CAPTCHA_MAX_ATTEMPTS=${CAPTCHA_MAX_ATTEMPTS:-5}
      - CAPTCHA_SECRET=${CAPTCHA_SECRET:-alumni-istu-local-captcha-secret-2026}
      - CAPTCHA_SITE_KEY=${CAPTCHA_SITE_KEY:-}
      - CAPTCHA_SECRET_KEY=${CAPTCHA_SECRET_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-kamasya}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-kamasyaatha.frari@ogr.iu.edu.tr}
      - ADMIN_FULL_NAME=${ADMIN_FULL_NAME:-Kamasya Atha Frari}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminPass2026!}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html

  db:
    image: mysql:8.0
    container_name: alumni_istu_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${DB_NAME:-alumni_istu}
      - MYSQL_USER=${DB_USER:-alumni_admin}
      - MYSQL_PASSWORD=${DB_PASS:-alumni_secure_2026}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_secure_2026}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      # Persistent named volume - vital for passing 'The Forgetting Test'
      - alumni_istu_mysql_data:/var/lib/mysql
      # Initial database schema setup
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-alumni_admin}", "-p${DB_PASS:-alumni_secure_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alumni_istu_mysql_data:
    driver: local
