<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>500 Server Error • AlumniIstü</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="text-center space-y-4 max-w-md px-6">
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-rose-500/10 border border-rose-500/30 rounded-full text-rose-400 text-xs font-mono uppercase tracking-wider mb-2">
            🛡️ 5xx Guardian Middleware
        </div>
        <h1 class="text-6xl font-extrabold text-rose-500 font-mono">500</h1>
        <h2 class="text-xl font-bold text-white">Internal Server Error</h2>
        <p class="text-sm text-slate-400">An unexpected error occurred while processing <code class="text-rose-300 bg-slate-900 px-2 py-0.5 rounded">{{PATH}}</code>.</p>
        <div class="text-xs text-slate-300 font-mono bg-slate-900/90 border border-slate-800 p-3 rounded-lg text-left space-y-1">
            <div><span class="text-slate-500 uppercase font-semibold">Incident Reference:</span> <code class="text-rose-400">{{ERROR_ID}}</code></div>
            <div><span class="text-slate-500 uppercase font-semibold">Log Storage:</span> <code class="text-slate-400">logs/error.logs</code></div>
            <div><span class="text-slate-500 uppercase font-semibold">Status:</span> {{REASON}}</div>
        </div>
        <div class="flex items-center justify-center gap-3 pt-2">
            <a href="/" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-xs font-semibold hover:bg-slate-700 transition">Return to Directory</a>
            <a href="javascript:location.reload()" class="px-4 py-2 bg-rose-600/20 text-rose-300 border border-rose-500/30 rounded-lg text-xs font-semibold hover:bg-rose-600/30 transition">Try Again</a>
        </div>
    </div>
</body>
</html>
