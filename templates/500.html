<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Server Error • AlumniIstü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-navy: #14213D;
            --color-cream: #F4EDE0;
            --color-coral: #FF6B58;
            --color-canvas: #14213D;
            --color-surface: #1c2a4a;
            --color-text-main: #F4EDE0;
            --color-accent: #FF6B58;

            --font-ivy-presto: 'Ivy Presto', 'Playfair Display', serif;
            --font-inter: 'Inter', sans-serif;
            
            --radius-full: 9999px;
            --radius-lg: 10px;
            --page-max-width: 1216px;
            --section-gap: 160px;
        }
        body {
            background-color: var(--color-canvas);
            color: var(--color-text-main);
            font-family: var(--font-inter);
        }
        .surface-card {
            background-color: var(--color-surface);
            border: 1px solid rgba(244, 237, 224, 0.14);
            border-radius: var(--radius-lg);
            box-shadow: none;
        }
        .btn-primary-coral {
            background-color: var(--color-coral);
            color: var(--color-cream);
            border: 1px solid var(--color-coral);
            border-radius: var(--radius-full);
            padding: 10px 20px;
            font-weight: 500;
            font-size: 0.875rem;
        }
        .btn-ghost-cream {
            background-color: transparent;
            color: var(--color-cream);
            border: 1px solid var(--color-cream);
            border-radius: var(--radius-full);
            padding: 10px 20px;
            font-weight: 400;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="surface-card max-w-md w-full p-8 text-center space-y-4">
        <div class="inline-flex items-center gap-2 px-3.5 py-1 bg-[#FF6B58]/15 border border-[#FF6B58]/40 rounded-full text-[#FF6B58] text-xs font-medium uppercase tracking-wider">
            🛡️ 5xx Guardian Middleware
        </div>
        <h1 class="text-5xl font-normal text-[#FF6B58]" style="font-family: var(--font-ivy-presto); letter-spacing: 0.02em;">500</h1>
        <h2 class="text-2xl font-normal text-[#F4EDE0]" style="font-family: var(--font-ivy-presto);">Internal Server Error</h2>
        <p class="text-sm text-[#F4EDE0]/75 font-light">
            An unexpected error occurred while processing <code class="text-[#FF6B58] bg-[#14213D] px-2 py-0.5 rounded">{{PATH}}</code>.
        </p>
        <div class="text-xs text-[#F4EDE0]/80 bg-[#14213D] border border-[#F4EDE0]/15 p-3.5 rounded-[10px] text-left space-y-1">
            <div><span class="text-[#F4EDE0]/55 uppercase font-medium">Incident Reference:</span> <code class="text-[#FF6B58]">{{ERROR_ID}}</code></div>
            <div><span class="text-[#F4EDE0]/55 uppercase font-medium">Log Storage:</span> <code class="text-[#F4EDE0]/75">logs/error.logs</code></div>
            <div><span class="text-[#F4EDE0]/55 uppercase font-medium">Status:</span> {{REASON}}</div>
        </div>
        <div class="flex items-center justify-center gap-3 pt-2">
            <a href="/" class="btn-primary-coral">Return to Directory</a>
            <a href="javascript:location.reload()" class="btn-ghost-cream">Try Again</a>
        </div>
    </div>
</body>
</html>
