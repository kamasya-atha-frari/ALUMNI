<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found • AlumniNexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="text-center space-y-4">
        <h1 class="text-6xl font-extrabold text-amber-500 font-mono">404</h1>
        <h2 class="text-xl font-bold text-white">Route Not Found</h2>
        <p class="text-sm text-slate-400">The requested endpoint <code>{{PATH}}</code> does not exist.</p>
        <a href="/" class="inline-block mt-4 px-4 py-2 bg-slate-800 text-white rounded-lg text-xs font-semibold hover:bg-slate-700">Return to Directory</a>
    </div>
</body>
</html>
